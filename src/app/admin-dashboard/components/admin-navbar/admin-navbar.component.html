<header class="navbar bg-base-100/80 backdrop-blur border-b sticky top-0 z-50">
  <div class="container mx-auto max-w-7xl px-3 md:px-4 w-full flex items-center gap-2">

    <!-- Hamburguesa SOLO móvil -->
    <label for="sidebar"
           class="btn btn-ghost btn-square lg:hidden"
           aria-label="Abrir menú">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </label>

    <!-- Brand -->
    <a class="btn btn-ghost h-auto min-h-0 px-1 md:px-2 text-xl md:text-2xl font-extrabold tracking-tight">
      <span class="mr-1">🖲️</span><span class="text-primary">CarlosVM</span>
    </a>

    <div class="divider divider-horizontal mx-1 hidden sm:flex"></div>
    <span class="badge badge-primary badge-outline hidden sm:inline-flex">Admin</span>

    <!-- Indicador WS -->
    <div class="tooltip tooltip-bottom hidden sm:flex" [attr.data-tip]="wsOnline() ? 'Tiempo real activo' : 'Sin conexión en tiempo real'">
      <span class="flex items-center gap-1 text-xs px-2 py-0.5 rounded-full border"
            [ngClass]="wsOnline()
              ? 'border-success/40 text-success bg-success/10'
              : 'border-error/40 text-error bg-error/10'">
        <span class="w-1.5 h-1.5 rounded-full"
              [ngClass]="wsOnline() ? 'bg-success animate-pulse' : 'bg-error'"></span>
        {{ wsOnline() ? 'Live' : 'Off' }}
      </span>
    </div>

    <!-- Acciones derecha -->
    <div class="ml-auto flex items-center gap-1 md:gap-2">

      <!-- Búsqueda global (md+) -->
      <label class="input input-bordered hidden md:flex items-center gap-2 w-64">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="global-search" type="text" placeholder="Buscar… (⌘/Ctrl + K)" />
      </label>

      <!-- Tema -->
      <label class="swap swap-rotate btn btn-ghost btn-circle" aria-label="Cambiar tema">
        <input type="checkbox" [checked]="checked()" (change)="changeTheme()" />
        <!-- sol -->
        <svg class="swap-on h-5 w-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <path d="M160 256a96 96 0 1 0 192 0 96 96 0 0 0-192 0zm96-184a24 24 0 0 1 24 24v32a24 24 0 0 1-48 0V96a24 24 0 0 1 24-24zm0 328a24 24 0 0 0-24 24v32a24 24 0 0 0 48 0v-32a24 24 0 0 0-24-24zM394 118a24 24 0 0 0-34 0l-23 23a24 24 0 1 0 34 34l23-23a24 24 0 0 0 0-34zM118 394a24 24 0 0 0 0 34l23 23a24 24 0 0 0 34-34l-23-23a24 24 0 0 0-34 0zM464 232h-32a24 24 0 0 0 0 48h32a24 24 0 0 0 0-48zM80 232H48a24 24 0 0 0 0 48h32a24 24 0 0 0 0-48zM394 394a24 24 0 0 1 0 34l-23 23a24 24 0 0 1-34-34l23-23a24 24 0 0 1 34 0zM118 118a24 24 0 0 1 34 0l23 23a24 24 0 1 1-34 34l-23-23a24 24 0 0 1 0-34z"/>
        </svg>
        <!-- luna -->
        <svg class="swap-off h-5 w-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </label>

      <!-- Notificaciones -->
      <button class="btn btn-ghost btn-circle" aria-label="Notificaciones">
        <div class="indicator">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="badge badge-primary badge-xs indicator-item"></span>
        </div>
      </button>

      <!-- Perfil dropdown -->
      <div class="dropdown dropdown-end">
        <label tabindex="0" class="btn btn-ghost btn-circle avatar">
          <div class="w-8 md:w-9 rounded-full bg-base-300 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 opacity-60" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
        </label>
        <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[60] p-2 shadow bg-base-100 rounded-box w-52 border">
          <li>
            <a routerLink="/admin-dashboard/profile" class="gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              Mi perfil
            </a>
          </li>
          <li>
            <a routerLink="/admin-dashboard/preferences" class="gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              Preferencias
            </a>
          </li>
          <li class="mt-1 border-t pt-1">
            <a (click)="logout()" class="text-error gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Salir
            </a>
          </li>
        </ul>
      </div>

    </div>
  </div>
</header>
