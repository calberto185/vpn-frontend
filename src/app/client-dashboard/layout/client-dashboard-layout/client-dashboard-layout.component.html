<!-- Dialog Seleccionar Plan -->
<dialog id="view_select_plans" class="modal">
  <!-- Fullscreen -->
  <div class="modal-box max-w-none w-screen h-[100dvh] max-h-none p-0 rounded-none overflow-hidden">
    <form method="dialog">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4" aria-label="Cerrar">✕</button>
    </form>

    <!-- Layout interno a pantalla completa -->
    <div class="h-full flex flex-col">
      <!-- Header con título + selector idioma/moneda -->
      <div class="flex items-center justify-between border-b p-4">
        <h3 class="text-lg font-bold">
          Elige el plan que mejor te convenga!
        </h3>
        <div class="flex items-center gap-2 pr-12">
          <app-language-coin></app-language-coin>
        </div>
      </div>

      <!-- Zona con scroll -->
      <div class="flex-1 overflow-auto p-4">
        <app-show-client-plans></app-show-client-plans>
      </div>
    </div>
  </div>

  <form method="dialog" class="modal-backdrop">
    <button aria-label="Cerrar">close</button>
  </form>
</dialog>




<!-- Atajo global: Ctrl/Cmd + K -->
<script>
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      const input = document.getElementById('global-search');
      if (input) { e.preventDefault(); input.focus(); }
    }
  });
</script>
