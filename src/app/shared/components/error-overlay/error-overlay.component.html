@if (isVisible) {
<div class="fixed inset-0 flex flex-col items-center justify-center bg-white text-center z-[9999]">
  <svg width="400" height="240" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Gradiente principal (círculo / líneas / halo) -->
      <linearGradient id="grad-primary" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f87171"/>   <!-- rojo suave -->
        <stop offset="100%" stop-color="#b91c1c"/> <!-- rojo medio -->
      </linearGradient>

      <!-- Glow envolvente -->
      <radialGradient id="grad-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fca5a520"/> <!-- tono cálido y tenue -->
        <stop offset="100%" stop-color="#b91c1c00"/>
      </radialGradient>

      <!-- Sombra elegante -->
      <filter id="shadow-soft" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#b91c1c20"/>
      </filter>

      <!-- Animaciones -->
      <animateTransform id="float" attributeName="transform" type="translate"
        values="0,0;0,4;0,0" dur="4s" repeatCount="indefinite" additive="sum"/>
      <animateTransform id="pulse" attributeName="transform" type="scale"
        values="1;1.03;1" dur="4s" repeatCount="indefinite" additive="sum"/>
    </defs>

    <!-- Fondo blanco puro -->
    <rect width="400" height="240" fill="#ffffff"/>

    <!-- Glow de fondo -->
    <circle cx="200" cy="100" r="100" fill="url(#grad-glow)"/>

    <!-- Círculo dinámico (núcleo rojo suave) -->
    <g transform="translate(150,50)" filter="url(#shadow-soft)">
      <circle cx="50" cy="50" r="45" fill="url(#grad-primary)" opacity="0.95">
        <use href="#pulse"/>
        <use href="#float"/>
      </circle>

      <!-- Fractura de energía -->
      <path d="M52 25 L40 60 H58 L48 85"
            stroke="#ffffff" stroke-width="5" stroke-linecap="round"
            stroke-linejoin="round" fill="none">
        <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="1.1s" fill="freeze"/>
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
      </path>
    </g>

    <!-- Halo dinámico -->
    <circle cx="200" cy="100" r="68" fill="none" stroke="#f8717130" stroke-width="2.2">
      <animate attributeName="r" values="68;74;68" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- Texto principal -->
    <text x="200" y="195" font-family="Inter, 'Segoe UI', Arial, sans-serif"
          font-size="22" font-weight="700" text-anchor="middle"
          fill="#b91c1c">
      {{ title }}
      <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0,6" to="0,0" dur="1s" fill="freeze"/>
    </text>

    <!-- Subtexto -->
    <text x="200" y="215" font-family="Inter, 'Segoe UI', Arial, sans-serif"
          font-size="15" fill="black" text-anchor="middle" opacity="0.9">
      {{ message }}
      <animate attributeName="opacity" from="0" to="1" dur="1.4s" begin="0.3s" fill="freeze"/>
    </text>

    <!-- Línea decorativa -->
    <rect x="120" y="225" width="160" height="2" rx="1" fill="url(#grad-primary)">
      <animate attributeName="width" from="0" to="160" dur="1.2s" fill="freeze"/>
    </rect>

    <!-- Partículas rojas suaves -->
    <circle cx="310" cy="90" r="3" fill="#ef444440">
      <animateTransform attributeName="transform" type="translate"
        values="0,0;0,4;0,0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="110" r="2.5" fill="#fca5a540">
      <animateTransform attributeName="transform" type="translate"
        values="0,0;0,-3;0,0" dur="5s" repeatCount="indefinite"/>
    </circle>
  </svg>

  <button
    class="mt-4 bg-rose-500 text-white px-4 py-2 rounded-lg shadow hover:bg-rose-600 transition-colors duration-200"
    (click)="reloadPage()"
  >
    Reintentar
  </button>
</div>


}
