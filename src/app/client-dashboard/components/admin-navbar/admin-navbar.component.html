<header class="navbar bg-base-100/80 backdrop-blur border-b sticky top-0 z-50">
      <div class="container mx-auto max-w-7xl px-3 md:px-4 w-full flex items-center gap-2">
        <!-- Hamburguesa SOLO móvil, dentro del flujo -->
        <label for="sidebar"
               class="btn btn-ghost btn-square lg:hidden"
               aria-label="Abrir menú">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </label>

        <!-- Brand -->
        <a class="btn btn-ghost h-auto min-h-0 px-1 md:px-2 text-xl md:text-2xl font-extrabold tracking-tight">
          <span class="mr-1">VPN</span><span class="text-primary">CarlosVM</span>
        </a>

        <div class="divider divider-horizontal mx-1 hidden sm:flex"></div>
        <span class="badge badge-primary badge-outline hidden sm:inline-flex">Admin</span>

        <!-- acciones a la derecha -->
        <div class="ml-auto flex items-center gap-1 md:gap-2">
          <label class="input input-bordered hidden md:flex items-center gap-2 w-64">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="global-search" type="text" placeholder="Buscar… (⌘/Ctrl + K)" />
          </label>

          <button class="btn btn-ghost btn-circle" aria-label="Tema">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9c0-4.97-4.03-9-9-9Z"/></svg>
          </button>

          <button class="btn btn-ghost btn-circle" aria-label="Notificaciones">
            <div class="indicator">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="badge badge-primary badge-xs indicator-item"></span>
            </div>
          </button>

          <div class="dropdown dropdown-end">
            <label tabindex="0" class="btn btn-ghost btn-circle avatar">
              <div class="w-8 md:w-9 rounded-full">
                <img src="https://i.pravatar.cc/100?img=13" alt="Admin" />
              </div>
            </label>
            <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[60] p-2 shadow bg-base-100 rounded-box w-56">
              <li><a>Mi perfil</a></li>
              <li><a>Preferencias</a></li>
              <li><a class="text-error">Salir</a></li>
            </ul>
          </div>
        </div>
      </div>
    </header>
